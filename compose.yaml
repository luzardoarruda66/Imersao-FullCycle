name: fullcycle-chat

services:
  # Compila o `packages/chat-events` para `dist/` e o recompila a cada mudança. A `chat-api` e o `web` leem o `dist` pelo
  # hard link que o `pnpm install` do `file:` cria: o `tsc` reescreve cada arquivo no lugar, e os dois enxergam a mudança
  # sem reinstalar. Arquivo novo no pacote não ganha o link: reinstale nos dois projetos (`AGENTS.md` da `chat-api`).
  chat-events:
    build:
      context: ./apps/chat-api
      dockerfile: Dockerfile.dev
    working_dir: /workspace/packages/chat-events
    volumes:
      - .:/workspace
    command: ["sh", "-c", "pnpm install && pnpm exec tsc -p tsconfig.json --watch --preserveWatchOutput"]
    healthcheck:
      # Saudável quando o primeiro `dist` existe: a `chat-api` e o `web` só instalam depois disso.
      test: ["CMD-SHELL", "test -f dist/index.js"]
      interval: 3s
      timeout: 2s
      retries: 60

  chat-api:
    build:
      context: ./apps/chat-api
      dockerfile: Dockerfile.dev
    working_dir: /workspace/apps/chat-api
    volumes:
      - .:/workspace
    environment:
      PORT: 3001
      DATABASE_URL: postgres://chat_api:chat_api@postgres:5432/chat
      COOKIE_DOMAIN: ""
      WEB_ORIGIN: http://localhost:3000
      REDIS_URL: redis://redis:6379
      # Rede interna do Compose, de onde vem o BFF (LLD, "Segurança": origem do IP).
      TRUSTED_PROXY: loopback,linklocal,uniquelocal
    ports:
      - "3001:3001"
    depends_on:
      chat-events:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    working_dir: /workspace/apps/web
    volumes:
      - .:/workspace
    environment:
      # Endereço da API do chat entre contêineres (AGENTS.md da raiz, "Rede entre serviços").
      CHAT_API_URL: http://chat-api:3001
      # O navegador fala com a API do chat direto pelo WebSocket (LLD, seção 8): endereço da máquina, não do contêiner.
      NEXT_PUBLIC_CHAT_WS_URL: http://localhost:3001
      COOKIE_DOMAIN: ""
    ports:
      - "3000:3000"
    depends_on:
      chat-events:
        condition: service_healthy
      chat-api:
        condition: service_started

  # Testes de navegador: imagem oficial do Playwright, fora da subida padrão (`scripts/e2e.sh`).
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: [e2e]
    working_dir: /workspace/apps/web
    volumes:
      - .:/workspace
    depends_on:
      - web
      - chat-api

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.53
    command: server -dir=/data -s3
    volumes:
      - s3-data:/data
    ports:
      - "8333:8333"

volumes:
  postgres-data:
  s3-data:

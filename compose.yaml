name: fullcycle-chat

services:
  chat-api:
    build:
      context: ./apps/chat-api
      dockerfile: Dockerfile.dev
    working_dir: /workspace/apps/chat-api
    volumes:
      - .:/workspace
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    working_dir: /workspace/apps/web
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
    depends_on:
      - chat-api

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.53
    command: server -dir=/data -s3
    volumes:
      - s3-data:/data
    ports:
      - "8333:8333"

volumes:
  postgres-data:
  s3-data:
